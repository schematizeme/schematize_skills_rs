name: ci

# POR QUE ISTO EXISTE, E POR QUE NASCE JUNTO COM O REPO
#
# O `schematize_cli_rs` viveu com 431 testes e NENHUM workflow que os rodasse. A Definition
# of Done da casa exige "CI verde", e sem workflow a frase era verdadeira por vacuidade — a
# pior maneira de uma regra ser cumprida. Custou uma passada dedicada para consertar.
#
# Este repo não repete isso: o CI entra no mesmo marco em que o código entra. Um repo que
# nasce sem CI não "ganha CI depois"; ele ganha o hábito de fundir sem verificar.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  verificar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Slint com backend winit + renderer femtovg precisa do X11/Wayland/fontconfig de
      # DESENVOLVIMENTO para LINKAR, mesmo sem abrir janela nenhuma no CI.
      #
      # **Entrou junto com o segundo binário (ADR-0020), e não depois.** No dia em que a janela
      # passou a morar neste repo, `cargo build` deixou de ser só o CLI: sem estas libs, o link
      # do `schematize-skills-gui` falha e leva junto um CI que nada tem a ver com janela.
      - name: deps de sistema (Slint)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y \
            pkg-config \
            libx11-dev libxcursor-dev libxrandr-dev libxi-dev \
            libxkbcommon-dev libwayland-dev libgl1-mesa-dev \
            libxcb1-dev libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev \
            libfontconfig1-dev

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: fmt
        run: cargo fmt --check

      - name: clippy
        run: cargo clippy --all-targets -- -D warnings

      # TODO teste deste repo roda num HOME temporário, e a verificação é essa.
      #
      # O app lê o cadastro de contas de `~/.claude/schematize/`. Um teste que usasse o HOME
      # real leria as contas de quem está rodando a suíte — e, pior, o `detect --add` as
      # ESCREVERIA. No CI isso passaria despercebido (o runner é limpo); na máquina de quem
      # desenvolve, cadastraria conta sem ninguém pedir.
      # Aqui os testes moram nos módulos `#[cfg(test)]` de `src/` (não há `tests/` neste repo);
      # `tests/` só entra na varredura se um dia existir. A região de teste de um arquivo de
      # `src/` começa no 1º `#[cfg(test)]`; um arquivo de `tests/` é inteiro teste. Região de
      # teste que LÊ o HOME real (`env::var("HOME")`, `home_dir`, `dirs::home`, `home()`) só passa
      # se a MESMA região o SETA para um temporário (`set_var("HOME"` / `.env("HOME"`).
      - name: nenhum teste usa o HOME real
        run: |
          set -u
          LE='env::var(_os)?\("HOME"\)|home_dir|dirs::home|(^|[^_[:alnum:]])home\(\)'
          SETA='set_var\("HOME"|\.env\("HOME"'
          falhou=0
          vistos=0
          regiao() { # imprime só o código de teste do arquivo
            case "$1" in
              tests/*) cat "$1" ;;
              *) awk '/#\[cfg\(test\)\]/ { t = 1 } t' "$1" ;;
            esac
          }
          while IFS= read -r f; do
            vistos=$((vistos + 1))
            r=$(regiao "$f")
            if printf '%s\n' "$r" | grep -Eq "$LE" && ! printf '%s\n' "$r" | grep -Eq "$SETA"; then
              echo "::error file=$f::teste lê o HOME real sem SETAR o HOME para um temporário"
              printf '%s\n' "$r" | grep -En "$LE" | head -5
              falhou=1
            fi
          done < <(find src tests -name '*.rs' -type f 2>/dev/null | sort)
          [ "$vistos" -gt 0 ] || { echo "::error::nenhum .rs varrido — a guarda ficou cega"; exit 1; }
          echo "guarda do HOME: $vistos arquivos varridos"
          exit "$falhou"

      - name: testes
        run: cargo test --all-targets

      # A 2ª passada caça teste que depende de ordem ou de estado deixado pela 1ª. Barato, e
      # já pegou flaky nesta casa.
      - name: testes (segunda passada, caça a flaky)
        run: cargo test --all-targets

      # O build `--locked` prova que o Cargo.lock commitado RESOLVE — sem isto, um lock
      # desatualizado só aparece na máquina de quem clona.
      - name: build --locked
        run: cargo build --locked
